<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Globe</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three-globe"></script>

  <div id="container"></div>

  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 300;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const globe = new ThreeGlobe()
      .globeImageUrl('https://unpkg.com/three-globe/example/img/earth-dark.jpg');

    scene.add(globe);

    const light = new THREE.DirectionalLight(0xffffff, 0.8);
    light.position.set(1,1,1);
    scene.add(light);

    function animate() {
      requestAnimationFrame(animate);
      globe.rotation.y += 0.001;
      renderer.render(scene, camera);
    }
    animate();

    // Example clickable marker
    globe.pointsData([
      { lat: 31.9522, lng: 35.2332, name: "Palestine" },
      { lat: 36.8065, lng: 10.1815, name: "Tunisia" },
      { lat: -30.5595, lng: 22.9375, name: "South Africa" },
      { lat: 35.6762, lng: 139.6503, name: "Japan" },
      { lat: 4.7110, lng: -74.0721, name: "Colombia" }
    ])
    .pointLat('lat')
    .pointLng('lng')
    .pointLabel('name')
    .onPointClick(point => {
      // Send message to Flutter
      Flutter.postMessage(point.name);
    });
  </script>
</body>
</html>
